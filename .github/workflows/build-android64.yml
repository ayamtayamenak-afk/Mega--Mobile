name: Build Mega Mobile Android64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Mega Mobile
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          build-config: Release

      - name: Upload GEODE
        uses: actions/upload-artifact@v4
        with:
          name: Mega-Mobile-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
