name: Build Mega Mobile Android64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest
          build-config: Release

      - name: Upload GEODE
        uses: actions/upload-artifact@v4
        with:
          name: Mega-Mobile-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
